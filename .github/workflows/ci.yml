name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --locked

  db:
    name: connected mode (PostgreSQL 16)
    runs-on: ubuntu-24.04
    env:
      EXPLAINSQL_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/explainsql?sslmode=disable
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Start PostgreSQL 16 with HypoPG and the fixture schema
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-16 postgresql-16-hypopg
          sudo systemctl start postgresql
          sudo -u postgres psql -c "ALTER USER postgres PASSWORD 'postgres'"
          sudo -u postgres createdb explainsql
          export PGPASSWORD=postgres
          psql -h localhost -U postgres -d explainsql -q -v ON_ERROR_STOP=1 -f fixtures/schema.sql
          psql -h localhost -U postgres -d explainsql -c "CREATE EXTENSION hypopg"
      # One test at a time: building an index in one test waits for the
      # locks of another's rolled-back UPDATE.
      - run: cargo test --locked -p explainsql-db -p explainsql -- --test-threads=1

  package:
    name: crates.io packages
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Each crate carries the licenses
        run: |
          for crate in crates/*/; do
            cmp LICENSE-MIT "$crate/LICENSE-MIT"
            cmp LICENSE-APACHE "$crate/LICENSE-APACHE"
          done
      # Packages and builds every crate as crates.io would, without uploading.
      - run: cargo publish --workspace --dry-run --locked
