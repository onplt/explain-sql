[workspace]
resolver = "3"
members = ["crates/*", "xtask"]
exclude = ["fuzz"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.85"
publish = false
repository = "https://github.com/onplt/explain-sql"

[workspace.dependencies]
explainsql-core = { path = "crates/explainsql-core" }
explainsql-db = { path = "crates/explainsql-db" }
explainsql-tui = { path = "crates/explainsql-tui" }
clap = { version = "4.5", features = ["derive"] }
insta = "1"
# 0.30 needs Rust 1.86; the workspace supports 1.85.
ratatui = "0.29"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "time", "sync", "macros"] }
tokio-postgres = { version = "0.7", features = ["with-serde_json-1"] }
tokio-postgres-rustls = { version = "0.14", features = ["ring"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
