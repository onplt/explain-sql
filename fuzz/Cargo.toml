[package]
name = "explainsql-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
explainsql-core = { path = "../crates/explainsql-core" }
libfuzzer-sys = "0.4"

[[bin]]
name = "parse"
path = "fuzz_targets/parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "analyze"
path = "fuzz_targets/analyze.rs"
test = false
doc = false
bench = false

# Not part of the main workspace: fuzzing needs a nightly toolchain.
[workspace]
members = ["."]
